name: cityrun_app
description: City Run — last-mile electric bicycle delivery for Lagos.
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  intl: ^0.19.0
  flutter_svg: ^2.0.17
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
