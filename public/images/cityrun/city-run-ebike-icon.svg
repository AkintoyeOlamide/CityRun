<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="ebike-frame" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B9BF8"/>
      <stop offset="1" stop-color="#3478F6"/>
    </linearGradient>
    <linearGradient id="ebike-bolt" x1="28" y1="18" x2="36" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <!-- Wheels -->
  <circle cx="18" cy="42" r="9" stroke="#3478F6" stroke-width="2.5" fill="#0B1424"/>
  <circle cx="46" cy="42" r="9" stroke="#3478F6" stroke-width="2.5" fill="#0B1424"/>
  <circle cx="18" cy="42" r="2.5" fill="#93C5FD"/>
  <circle cx="46" cy="42" r="2.5" fill="#93C5FD"/>
  <!-- Frame -->
  <path
    d="M18 42 L28 22 L38 22 L46 34 L40 42 L28 42 L24 36 Z"
    stroke="url(#ebike-frame)"
    stroke-width="3"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Handlebars -->
  <path d="M28 22 L26 14 M28 22 L30 14" stroke="#3478F6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M24 34 Q32 28 38 34" stroke="#3478F6" stroke-width="2.25" stroke-linecap="round"/>
  <!-- Electric bolt on downtube -->
  <path
    d="M33 28 L31 33 H35 L33 38 L37 31 H33 Z"
    fill="url(#ebike-bolt)"
  />
  <!-- Battery pack -->
  <rect x="36" y="24" width="8" height="5" rx="1.5" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1.25"/>
  <!-- Delivery box -->
  <rect x="40" y="12" width="13" height="9" rx="2" fill="#FACC15" stroke="#CA8A04" stroke-width="1.25"/>
  <path d="M44 12 V10.5 H49 V12" stroke="#CA8A04" stroke-width="1.25" stroke-linecap="round"/>
</svg>
